<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎂 Happy Birthday Vanessa</title>
<style>
:root{--bg:#120b2e;--fg:#fff;--pink:#ff6ec7;--yellow:#ffe14d;--cyan:#4de1ff;--green:#5dff9a;--red:#ff5d73;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120b2e;--fg:#fff}}
:root[data-theme="dark"]{--bg:#120b2e;--fg:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2a1760,var(--bg) 70%);color:var(--fg);
font-family:"Courier New",ui-monospace,monospace;text-align:center;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
main{max-width:520px;margin:0 auto;padding:28px 18px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
main.top{justify-content:flex-start;padding-top:36px;padding-bottom:60px}
h1{font-size:clamp(26px,8vw,38px);margin:0;color:var(--cyan);text-shadow:0 0 14px var(--cyan)}
h2{font-size:clamp(22px,7vw,30px);margin:0;color:var(--yellow);text-shadow:0 0 12px var(--yellow)}
p{margin:4px 0;font-size:clamp(16px,4.6vw,19px);line-height:1.55}
.warn{color:var(--pink)}
.lord{color:var(--green);font-weight:bold}
.blink{animation:b 1s steps(2) infinite;color:var(--yellow);font-weight:bold;font-size:22px}
@keyframes b{50%{opacity:0}}
button{font:inherit;font-weight:bold;font-size:17px;padding:14px 22px;border:3px solid var(--yellow);background:#120b2e;color:var(--yellow);
border-radius:12px;cursor:pointer;box-shadow:0 0 14px var(--yellow);animation:pulse 1.4s infinite}
button:active{transform:scale(.96)}
@keyframes pulse{50%{box-shadow:0 0 28px var(--yellow)}}
#stage{position:relative;width:100%;height:320px}
#mv{position:absolute;transform:translate(-50%,-50%);max-width:62%;transition:left .5s ease,top .5s ease}
.cake{display:flex;flex-direction:column;align-items:center;margin:10px 0}
.candles{display:flex;gap:26px}
.candle{width:10px;height:36px;background:var(--cyan);border-radius:3px;position:relative}
.flame{position:absolute;top:-22px;left:-3px;width:16px;height:22px;background:radial-gradient(#fff,var(--yellow) 50%,#ff8a00);
border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:f .3s infinite alternate;transition:opacity .4s}
.out .flame{opacity:0;animation:none}
@keyframes f{to{transform:scale(1.15,.9) rotate(5deg)}}
.t{height:34px;border-radius:8px}
.t1{width:150px;background:var(--pink)}.t2{width:210px;background:var(--yellow)}.t3{width:270px;background:var(--red)}
.big{font-size:64px}.bounce{animation:bn 1s infinite alternate}
@keyframes bn{to{transform:translateY(-14px)}}
#msg{width:100%;text-align:left}
#msg p{white-space:pre-line;margin:0 0 18px}
#msg h2{text-align:center;margin-bottom:18px}
small{opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<main id="m"></main>
<script>
const m=document.getElementById('m'), cv=document.getElementById('c'), cx=cv.getContext('2d');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let fast=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);

let parts=[],running=false;
function burst(n=140){
  const cols=['#ff6ec7','#ffe14d','#4de1ff','#5dff9a','#ff5d73','#fff'],em=['🎂','🎉','🎈','🎁','✨'];
  for(let i=0;i<n;i++)parts.push({x:cv.width/2,y:cv.height*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,
  s:Math.random()*8+5,c:cols[i%6],r:Math.random()*6,e:Math.random()<.45?em[i%5]:null});
  if(!running){running=true;loop()}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;cx.save();cx.translate(p.x,p.y);
    if(p.e){cx.font=(p.s*3)+'px serif';cx.textAlign='center';cx.fillText(p.e,0,0)}
    else{cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6)}cx.restore()});
  parts=parts.filter(p=>p.y<cv.height+40);
  if(parts.length)requestAnimationFrame(loop);else{cx.clearRect(0,0,cv.width,cv.height);running=false}
}
async function type(el,t,sp=35){
  let i=0;for(const ch of t){el.textContent+=ch;if(++i%6===0)scrollTo({top:document.body.scrollHeight});await sleep(fast?0:sp)}
}

/* ---------- 1. Runaway button ---------- */
function intro(){
  fast=false;m.className='';
  m.innerHTML=`<h1>🎉 Happy Birthday Vanessa 🎉</h1>
  <p class="warn">⚠️ Warning: this page contains extra love. Proceed at your own risk 😎</p>
  <p>From: <b>Mr.Ofori</b></p>
  <div id="stage"><button id="mv" style="left:50%;top:50%">Click here</button></div>`;
  const steps=[
    ["Don't spoil the fun, click me 😏",66,50],
    ["Don't you miss me, click me 🏃",34,50],
    ["You're getting closer, click me 👀",50,14],
    ["I am right here! Click me 😂",80,84],
    ["Okay, all jokes aside, final final. Just click me 🙏",50,50]
  ];
  let i=0;const b=document.getElementById('mv');
  b.onclick=()=>{
    if(i>=steps.length){wish();return}
    const [t,x,y]=steps[i++];b.textContent=t;b.style.left=x+'%';b.style.top=y+'%';
  };
}

/* ---------- 2. Wish + cake ---------- */
async function wish(){
  m.className='';
  m.innerHTML=`<h2 id="w"></h2><p class="lord" id="l"></p>
  <div class="cake" id="ck" style="opacity:0;transition:opacity 1s"><div class="candles">
  <div class="candle"><div class="flame"></div></div><div class="candle"><div class="flame"></div></div><div class="candle"><div class="flame"></div></div></div>
  <div class="t t1"></div><div class="t t2"></div><div class="t t3"></div></div>
  <button id="b" style="display:none">💨 Blow out the candles</button>
  <p id="h" style="display:none">👆 Click to blow the candles</p>`;
  await type(document.getElementById('w'),'Make a wish, Baby girl 💖 (Matthew 7:7)',50);
  await sleep(400);
  await type(document.getElementById('l'),'The Lord is listening 🙏',50);
  await sleep(400);
  document.getElementById('ck').style.opacity=1;await sleep(1000);
  const b=document.getElementById('b'),h=document.getElementById('h');
  b.style.display='';h.style.display='';
  b.onclick=async()=>{
    b.style.display='none';h.style.display='none';
    document.getElementById('ck').classList.add('out');
    await sleep(700);burst(160);await sleep(1800);
    b.textContent='💌 Click here to read';b.style.display='';
    b.onclick=message;
  };
}

/* ---------- 3. The message ---------- */
const P=[
["h",`Happy Birthday Vanessa Naana Darkwa.`],
["p",`On this day an amazing person was born, lucky me to know her. That's how they normally start their wishes, rightttttttttt? But I'll pass and I'm different`],
["p",`My forever baby girl, the bone of my bone, the one who used to run away from me in the past. (By this time you're saying, "Not today") So yes, not today`],
["p",`I just want to wish you a happy birthday, but this time with a different style and a little skills, cause as for me, I am extra and thats on period.`],
["p",`Another birthday and you look amazing, in better shape and glowing in the face of God. The celebration is all for you today and I hope and pray you really enjoy your day to the fullest`],
["p",`You've come a long way and you'll still continue to move forward (2003 to now is not a joke.) You deserve a day filled with genuine happiness, laughter and the goodness of GOD`],
["p",`May your dreams take flight and your aspirations be realized. You are plus one today. Today is your birthday, I would have sung but...`],
["p",`I wish for you a world of beautiful moments, adventure, endless happiness, good news, good health, blessings upon you and your family and the Lord's cover over you now and forever.`],
["p",`Thank you for being the wonderful person you are. Happy birthday again. Here's to celebrating you and all the incredible moments that lie ahead of you, I really appreciate you`],
["p",`I'm available whenever you decide, a dinner outing and also an arcade activity\nHave a good day, Psalm 20:4`],
["p",`With love & lots of joy,\nEmmanuel Nana Kojo Ofori 💌`]
];
const COL=['var(--fg)','var(--pink)','var(--cyan)','var(--green)','var(--yellow)'];
async function message(){
  fast=false;m.className='top';
  m.innerHTML=`<small>(tap the screen to speed things up)</small><div id="msg"></div>`;
  m.onclick=()=>{fast=true};
  const box=document.getElementById('msg');
  for(let i=0;i<P.length;i++){
    const [k,t]=P[i];const el=document.createElement(k==='h'?'h2':'p');
    if(k!=='h')el.style.color=COL[i%COL.length];
    box.appendChild(el);await type(el,t,24);await sleep(fast?0:350);
  }
  m.onclick=null;
  const b=document.createElement('button');b.textContent='Next 🎁';b.onclick=gift;
  box.appendChild(b);b.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- 4. Gift + loop ---------- */
async function gift(){
  fast=false;m.className='';m.onclick=null;
  m.innerHTML=`<div class="big bounce">🎁</div><h2 id="g"></h2><p id="e" style="color:var(--pink)"></p>
  <p class="blink" id="r" style="display:none">Read me again</p><button id="b" style="display:none">🔁 Play again</button>`;
  burst(80);
  await type(document.getElementById('g'),'Your gift is coming soon.',50);await sleep(500);
  await type(document.getElementById('e'),'Enjoy your day Nessa 💖',50);await sleep(700);
  document.getElementById('r').style.display='';await sleep(600);
  const b=document.getElementById('b');b.style.display='';b.onclick=intro;
}
intro();
</script>
</body>
</html>
